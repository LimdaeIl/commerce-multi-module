server:
  port: 40000

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:3300/commerce?sslMode=PREFERRED&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${RDS_USERNAME:commerce}
    password: ${RDS_PASSWORD:commerce}

    hikari:
      pool-name: hikari-dev
      maximum-pool-size: 10
      minimum-idle: 1
      leak-detection-threshold: 60000
      connection-timeout: 3000     # 3s  → 3,000 ms
      max-lifetime: 1800000        # 30m → 1,800,000 ms
      idle-timeout: 300000         # 5m  →   300,000 ms

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        show_sql: false
        jdbc.time_zone: Asia/Seoul
        generate_statistics: true
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 300
    open-in-view: false